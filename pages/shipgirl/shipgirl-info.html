<!DOCTYPE html>
<html lang="en">

<head>
    <base href="/altoy/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함선 정보 데이터베이스</title>
    <link rel="stylesheet" href="css/shipgirl-info.css">
    <link rel="stylesheet" href="css/nav.style.css">
</head>

<body>
    <div id="navbar-placeholder"></div>
    <div id="app">
        <!-- Main page view -->
        <div id="mainView" class="view">
            <header>
                <h1>함선 정보 데이터베이스</h1>
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="캐릭터 이름 검색...">
                    <select id="rarityFilter">
                        <option value="">모든 등급</option>
                        <option value="N">N</option>
                        <option value="R">R</option>
                        <option value="SR">SR</option>
                        <option value="SSR">SSR</option>
                        <option value="UR">UR</option>
                    </select>
                    <select id="shipTypeFilter">
                        <option value="">모든 함종</option>
                    </select>
                    <select id="nationalityFilter">
                        <option value="">모든 진영</option>
                    </select>
                    <div class="view-toggle">
                        <button class="view-toggle-btn active" id="gridViewBtn" title="그리드 보기">
                            ⊞
                        </button>
                        <button class="view-toggle-btn" id="listViewBtn" title="리스트 보기">
                            ☰
                        </button>
                    </div>
                </div>
            </header>
            <div id="shipgirls" class="shipgirl-grid"></div>
        </div>

        <!-- Detail page view -->
        <div id="detailView" class="view" style="display: none;">
            <header>
                <button id="backButton" class="back-button">← 목록으로 돌아가기</button>
                <h1 id="detailName"></h1>
            </header>
            <div id="detailContent" class="detail-content"></div>
        </div>

        <!-- Loading indicator -->
        <div id="loading" class="loading">로딩 중...</div>

        <!-- Error message -->
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script src="js/shipgirl-info.js"></script>
    <script src="js/nav.script.js"></script>
</body>

</html>
