<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/altoy/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삽화 갤러리</title>
    <link rel="stylesheet" href="css/misc.gallerypic.css">
    <link rel="stylesheet" href="css/nav.style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div id="navbar-placeholder"></div>

    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center text-gray-800 mb-12">벽람항로 삽화뷰어</h1>
        <div id="gallery" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
            <!-- Images will be loaded here by JavaScript -->
        </div>
    </div>

    <!-- Modal for displaying full image -->
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-75 z-50 flex justify-center items-center p-4">
        <div class="relative">
            <span id="close" class="absolute -top-4 -right-4 text-white text-4xl font-bold cursor-pointer hover:text-gray-400 transition-colors">&times;</span>
            <img id="modal-image" src="" alt="Full-size gallery image" class="max-w-full max-h-[90vh] rounded-lg shadow-2xl">
        </div>
    </div>

    <footer>
        <p>&copy; All images are a property/copyright of Manjuu, Xiamen Yongshi, Yostar Inc, and the kr publisher X.D. Global Limited, respectively.</p>
    </footer>

    <script src="js/misc.gallerypic.js"></script>
    <script src="js/nav.script.js"></script>
</body>
</html>
