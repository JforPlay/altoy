<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/altoy/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>벽람항로 로딩 일러</title>
    <link rel="stylesheet" href="css/misc/loadingbg.css">
    <link rel="stylesheet" href="css/nav.style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>
    <div class="header">
        <h1 class="title">벽람 로딩일러 모음</h1>
    </div>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="이미지 검색...">
        </div>
    </div>

    <div id="gallery" class="gallery"></div>

    <div id="lightbox" class="lightbox">
        <button class="lightbox-close">&times;</button>
        <button class="lightbox-prev">&#10094;</button>
        <button class="lightbox-next">&#10095;</button>
        <img id="lightbox-img" src="" alt="">
        <div class="lightbox-caption"></div>
    </div>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>이미지 로딩 중...</p>
    </div>

    <footer>
        <p>&copy; All images are a property/copyright of Manjuu, Xiamen Yongshi, Yostar Inc, and the kr publisher X.D. Global Limited, respectively.</p>
    </footer>

    <script src="js/misc/loadingbg.js"></script>
    <script src="js/nav.script.js"></script>
</body>
</html>
