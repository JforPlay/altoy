layout: default
title: 스킬/장비 탄막 시뮬레이터
head: |
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
    <link rel="stylesheet" href="css/simulators/sim.common.css">
---

<h1>스킬 탄막 시뮬레이터</h1>

<div id="simulation-wrapper">
    <div id="simulation-container">
        <div id="fps-display" style="position: fixed; top: 10px; right: 10px; 
            background: rgba(0,0,0,0.7); color: #0f0; padding: 5px 10px; 
            font-family: monospace; z-index: 9999;">FPS: --</div>
        <div id="player-area"></div>
        <div id="vanguard">
            <img src="assets/img/vanguard_chibi.png" alt="vanguard">
        </div>
        <div id="mainfleet">
            <img src="assets/img/mainfleet_chibi.png" alt="mainfleet">
        </div>

        <div id="enemy">
            <img src="assets/img/enemy_chibi.png" alt="enemy">
        </div>

        <div id="visual-log"></div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label for="skill-select">스킬 선택:</label>
            <select id="skill-select"></select>
        </div>
        <button id="fire-button">발사</button>
        <button id="enemy-toggle">적 위치: 상단</button>
    </div>

    <div id="stats-panel">
        <h2>탄막 정보</h2>
        <div id="stats-content">
            <p>데이터를 불러오는 중...</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="js/simulators/sim.engine.oceanbg.js"></script> <!-- should come first -->
<script src="js/simulators/sim.engine.bullet.factory.js"></script> <!-- should come before sim.engine.bullet.js -->
<script src="js/simulators/sim.engine.bullet.js"></script>
<script src="js/simulators/sim.engine.common.js"></script>
<script src="js/simulators/sim.weapon.data.js"></script>
<script src="js/simulators/sim.weapon.main.js"></script>
