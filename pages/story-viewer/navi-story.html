---
layout: default
title: 네비 스토리 뷰어
head: |
    <link rel="stylesheet" href="css/story-viewer/story-viewer.common.css">
    <link rel="stylesheet" href="css/story-viewer/child-story.css">
---

<div id="error-container" class="error-container hidden"></div>

<!-- Tab Navigation View -->
<div id="tab-navigation-view">
    <header class="viewer-header navi-header">
        <div class="header-content">
            <h1 class="header-title">네비키우기 한눈에 보기</h1>
            <p class="header-subtitle">각종 회상 / 폴라로이드 / 기타 이미지 모음</p>
        </div>
    </header>

    <nav class="tab-navigation">
        <button class="tab-btn active" data-tab="memories">
            <span class="material-symbols-outlined">auto_stories</span>
            <span>회상</span>
        </button>
        <button class="tab-btn" data-tab="endings">
            <span class="material-symbols-outlined">celebration</span>
            <span>엔딩</span>
        </button>
        <button class="tab-btn" data-tab="visits">
            <span class="material-symbols-outlined">location_city</span>
            <span>네비의 현실방문</span>
        </button>
        <button class="tab-btn" data-tab="daily">
            <span class="material-symbols-outlined">calendar_today</span>
            <span>네비의 일상</span>
        </button>
        <button class="tab-btn" data-tab="polaroids">
            <span class="material-symbols-outlined">photo_library</span>
            <span>폴라로이드</span>
        </button>
        <button class="tab-btn" data-tab="photos">
            <span class="material-symbols-outlined">collections</span>
            <span>기타 사진들</span>
        </button>
    </nav>

    <div class="flavor-text-box">
        <p>스토리 재생시 브금 자동재생에 주의하세요</p>
    </div>

    <!-- Memories Tab Content -->
    <div id="memories-content" class="tab-content active">
        <main id="memories-grid" class="navi-grid-container"></main>
    </div>

    <!-- Endings Tab Content -->
    <div id="endings-content" class="tab-content">
        <main id="endings-grid" class="navi-grid-container"></main>
    </div>

    <!-- Visits Tab Content -->
    <div id="visits-content" class="tab-content">
        <main id="visits-grid" class="navi-grid-container"></main>
    </div>

    <!-- Daily Life Tab Content -->
    <div id="daily-content" class="tab-content">
        <main id="daily-grid" class="navi-grid-container"></main>
    </div>

    <!-- Polaroids Tab Content -->
    <div id="polaroids-content" class="tab-content">
        <main id="polaroids-grid" class="navi-grid-container"></main>
    </div>

    <!-- Photos Tab Content -->
    <div id="photos-content" class="tab-content">
        <main id="photos-grid" class="navi-grid-container"></main>
    </div>
</div>

<!-- Story Viewer View (uses existing engine) -->
<div id="story-viewer-view" class="hidden">
    <div id="fade-overlay" class="fade-overlay"></div>
    <div id="viewer-container" class="viewer-container">
        <div class="story-background"></div>
        <header id="story-header" class="story-header">
            <button id="back-to-tabs" class="nav-button back-button">&#x2190;</button>
            <h2 id="story-title"></h2>
            <div id="progress-indicator" class="progress-indicator"></div>
            <button id="view-script-btn" class="nav-button" title="View Full Script">
                <span class="material-symbols-outlined">menu_book</span>
                전체 대사보기
            </button>
        </header>

        <div id="info-screen" class="info-screen hidden">
            <p id="info-screen-text"></p>
        </div>
        <div id="dialogue-box" class="dialogue-box">
            <div id="actor-portrait" class="actor-portrait"></div>
            <div class="dialogue-content">
                <p id="actor-name" class="actor-name"></p>
                <p id="dialogue-text" class="dialogue-text"></p>
            </div>
            <div id="next-page-indicator" class="next-page-indicator">▼</div>
        </div>
        <div id="options-box" class="options-box"></div>

        <div class="bottom-bar-container">
            <div id="audio-player-container" class="audio-player-container hidden">
                <button id="play-pause-btn" class="audio-btn">
                    <span class="material-symbols-outlined">play_arrow</span>
                </button>
                <div class="waveform-container">
                    <div class="waveform-bar"></div>
                    <div class="waveform-bar"></div>
                    <div class="waveform-bar"></div>
                    <div class="waveform-bar"></div>
                    <div class="waveform-bar"></div>
                </div>
                <span id="bgm-name" class="bgm-name"></span>
                <div class="volume-control">
                    <button id="mute-btn" class="audio-btn">
                        <span class="material-symbols-outlined">volume_up</span>
                    </button>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.01">
                </div>
            </div>

            <div class="story-nav-arrows">
                <button id="prev-line-btn" class="story-nav-btn">&#x2190; 이전</button>
                <button id="next-line-btn" class="story-nav-btn">다음 →</button>
                <button id="next-story-btn" class="story-nav-btn hidden">다음 스토리 보기 →</button>
                <button id="return-btn" class="story-nav-btn hidden">돌아가기</button>
            </div>

            <div class="bottom-bar-spacer"></div>
        </div>
    </div>
</div>

<!-- Polaroid Detail Modal -->
<div id="polaroid-modal" class="modal-overlay hidden">
    <div class="polaroid-modal-content">
        <button id="close-polaroid-modal" class="close-modal-btn" title="Close">
            <span class="material-symbols-outlined">close</span>
        </button>
        <div id="polaroid-detail" class="polaroid-detail">
            <div class="polaroid-images">
                <img id="polaroid-img-front" class="polaroid-img" alt="Polaroid Front">
                <img id="polaroid-img-back" class="polaroid-img hidden" alt="Polaroid Back">
            </div>
            <button id="flip-polaroid-btn" class="flip-polaroid-btn">
                <span class="material-symbols-outlined">flip</span>
                뒤집기
            </button>
            <div id="polaroid-info" class="polaroid-info"></div>
        </div>
    </div>
</div>

<!-- Script Modal -->
<div id="script-modal-overlay" class="modal-overlay hidden">
    <div class="modal-content">
        <button id="close-modal-btn" class="close-modal-btn" title="Close">
            <span class="material-symbols-outlined">close</span>
        </button>
        <div id="full-script-content" class="full-script-content"></div>
    </div>
</div>

<!-- Hidden dummy elements for story engine compatibility -->
<div id="event-selection-view" class="hidden"></div>
<div id="memory-selection-view" class="hidden"></div>
<div id="event-grid" class="hidden"></div>
<div id="memory-grid" class="hidden"></div>
<div id="search-bar" class="hidden"></div>
<div id="back-to-event-selection" class="hidden"></div>
<div id="back-to-memory-selection" class="hidden"></div>
<div id="memory-view-title" class="hidden"></div>
<div id="summary-modal-overlay" class="hidden"></div>
<div id="close-summary-modal-btn" class="hidden"></div>
<div id="summary-modal-content" class="hidden"></div>

<!-- Scripts -->
<script src="js/story-viewer/story-viewer.engine.js"></script>
<script src="js/story-viewer/child-story.js"></script>
<script src="js/story-viewer/child-navi-init.js"></script>
