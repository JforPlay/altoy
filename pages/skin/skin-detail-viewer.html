---
layout: default
title: 함순이 스킨/대사보기 (Modern UI)
head: |
    <link rel="stylesheet" href="css/skin/skin.common.css">
    <link rel="stylesheet" href="css/skin/skin.detail.viewer.css">
---

<div class="main-container">
    <header class="controls-header">
        <div class="title-wrapper">
            <h1 class="page-title">
                함순이 스킨 / 대사보기
                <span class="modern-badge">UI 개편!</span>
            </h1>
            <button id="info-button" class="info-button" aria-label="도움말 보기">
                <i class="fas fa-info-circle"></i>
            </button>
        </div>

        <!-- Modern Center Popup -->
        <div id="info-popup" class="info-popup" role="dialog" aria-labelledby="popup-title" aria-hidden="true">
            <div class="info-popup-content">
                <div class="popup-header">
                    <h2 id="popup-title">초간단 설명서</h2>
                    <button class="close-popup-btn" aria-label="닫기">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="popup-body">
                    <div class="instruction-step">
                        <div class="step-number">1</div>
                        <div class="step-content">
                            <h3>함순이를 고르기</h3>
                            <p>검색창에 이름을 입력하면 드랍다운에서 글자 검색이 가능합니다.</p>
                        </div>
                    </div>
                    <div class="instruction-step">
                        <div class="step-number">2</div>
                        <div class="step-content">
                            <h3>고른 함순이의 스킨 고르기</h3>
                            <p>선택한 스킨의 대사를 전부 보고 들을 수 있습니다.</p>
                        </div>
                    </div>
                    <div class="warning-box">
                        <i class="fas fa-exclamation-triangle"></i>
                        <div>
                            <strong>주의사항</strong>
                            <p>서약 대사는 해당 스킨이 서약대사가 있을때만 보입니다. <br>
                                극소수를 제외하면 거의 대부분 기본 스킨에만 서약대사가 보입니다.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="selectors">
            <div class="selector-wrapper">
                <label for="character-search-input">
                    <i class="fas fa-user"></i> 함순이 선택
                </label>
                <div class="dropdown-container">
                    <input type="text"
                           id="character-search-input"
                           placeholder="함순이를 검색/선택해주세요..."
                           autocomplete="off"
                           aria-label="함순이 검색"
                           aria-autocomplete="list"
                           aria-controls="character-dropdown-content">
                    <div class="dropdown-icon"><i class="fas fa-chevron-down"></i></div>
                    <div class="dropdown-content" id="character-dropdown-content" role="listbox"></div>
                </div>
            </div>
            <div class="selector-wrapper">
                <label for="skin-search-input">
                    <i class="fas fa-palette"></i> 스킨 선택
                </label>
                <div class="dropdown-container">
                    <input type="text"
                           id="skin-search-input"
                           placeholder="함순이를 먼저 선택해주세요..."
                           autocomplete="off"
                           disabled
                           aria-label="스킨 검색"
                           aria-autocomplete="list"
                           aria-controls="skin-dropdown-content">
                    <div class="dropdown-icon"><i class="fas fa-chevron-down"></i></div>
                    <div class="dropdown-content" id="skin-dropdown-content" role="listbox"></div>
                </div>
            </div>
            <button id="clear-filters-btn" class="clear-btn" title="검색 초기화" aria-label="검색 초기화">
                <i class="fas fa-redo-alt"></i>
                <span>초기화</span>
            </button>
        </div>
    </header>

    <!-- Loading skeleton -->
    <div id="loading-skeleton" class="loading-skeleton hidden">
        <div class="skeleton-card">
            <div class="skeleton-line skeleton-title"></div>
            <div class="skeleton-line skeleton-text"></div>
            <div class="skeleton-line skeleton-text"></div>
        </div>
        <div class="skeleton-card skeleton-gallery">
            <div class="skeleton-image"></div>
        </div>
    </div>

    <div id="skin-info-box" class="skin-info-box card hidden"></div>
    <div id="image-gallery" class="image-gallery card hidden"></div>
    <div id="text-content-area" class="text-content-area hidden"></div>
    <div id="oath-table-area" class="text-content-area hidden"></div>
</div>

<!-- Lightbox Modal for Images -->
<div id="lightbox-modal" class="lightbox-modal" role="dialog" aria-label="이미지 확대 보기" aria-hidden="true">
    <button class="lightbox-close" aria-label="닫기">
        <i class="fas fa-times"></i>
    </button>
    <button class="lightbox-prev" aria-label="이전 이미지">
        <i class="fas fa-chevron-left"></i>
    </button>
    <button class="lightbox-next" aria-label="다음 이미지">
        <i class="fas fa-chevron-right"></i>
    </button>
    <div class="lightbox-content">
        <img id="lightbox-image" src="" alt="">
        <div class="lightbox-caption"></div>
    </div>
    <div class="lightbox-counter"></div>
</div>

<!-- Scroll to Top Button -->
<button id="scroll-to-top" class="scroll-to-top hidden" aria-label="맨 위로 가기">
    <i class="fas fa-chevron-up"></i>
</button>

<script src="js/skin/skin.detail.viewer.js"></script>
