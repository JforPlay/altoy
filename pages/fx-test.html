<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/altoy/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이펙트 테스트</title>
    <link rel="stylesheet" href="css/fx-test.css">
</head>
<body>
    <h1>이펙트 렌더링 테스트</h1>

    <div class="controls">
        <label for="animation-select">애니메이션 선택:</label>
        <select id="animation-select">
            <option value="explosion">폭발 (2x2 그리드)</option>
            <option value="sequence">번개 (1x6 수직)</option>
            <option value="ice">얼음장비스킨 (5프레임)</option>
        </select>
    </div>

    <div class="sprite-container">
        <!-- This div will have its class changed by JavaScript -->
        <div id="sprite-box"></div>
    </div>

    <script src="js/fx-test.js"></script>
</body>
</html>
