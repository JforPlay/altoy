<!DOCTYPE html>
<html lang="en">

<head>
    <base href="/altoy/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "벽람 장난감" }}</title>
    <link rel="icon" href="assets/icon/favicon.ico" type="image/x-icon">

    <!-- Fonts and icons -->
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Global styles -->
    <link rel="stylesheet" href="css/global.style.css">
    <!-- Cloudflare Web Analytics -->
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "a34273493b4d4973a33713a7b1273213"}'></script>
    
    <!-- Shared Utilities (Loaded early for page scripts) -->
    <script src="js/utils.js"></script>

    {{ page.head }}

</head>

<body class="{{ page.body_class }}">
    {% include nav.html %}

    {{ content }}

    {% include footer.html %}

    <!-- Scroll to top button (Global) -->
    <button id="scroll-to-top" class="scroll-to-top hidden" aria-label="맨 위로 가기">
        <i class="fas fa-chevron-up"></i>
    </button>

    <!-- Global libraries -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>

    <!-- Global Script -->
    <script src="js/global.script.js"></script>
</body>

</html>
